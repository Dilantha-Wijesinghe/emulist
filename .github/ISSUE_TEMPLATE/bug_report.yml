name: Bug report
description: Something doesn't work or look as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help, especially for anything about the image.
    validations:
      required: true
  - type: input
    id: footage
    attributes:
      label: Footage
      description: Camera, LOG profile and codec, if it's about a clip.
      placeholder: "iPhone 16 Pro, Apple Log, ProRes 422 HQ"
  - type: input
    id: version
    attributes:
      label: Emulist version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.4, MacBook Pro M3 Pro"
    validations:
      required: true
